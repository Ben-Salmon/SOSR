# The fastMRI brain grid. To size a grid for new data, run mrisr-latent-extent
# --dataset brain (slurm/latent-extent.sh). For this grid, diffusion-priors'
# equivalent script reported:
#
# Median mm per voxel:  [0.6875 0.6875 5.    ]
# ROI lowest coordinate, 10th percentile (SU):  [ -94.21507035 -100.29713317  -46.59431439]
# ROI highest coordinate, 90th percentile (SU):  [ 94.64871746 108.07604572  32.06574384]
# ROI size (SU):  [188.86378782 208.37317889  78.66005823]


# The only view training loads.
VIEWS: ["ax"]
SCALE_FACTOR: 1
RAW_SU_PER_LVOX: 0.75
x_size_su: [150, 150, 80]
X_MIN_COORDS_SU: [-75, -75, -40]
