# Copy of diffusion-priors/latent_image_geometry/kaggle_cmr_train.yaml, so that
# the two models super-resolve onto the same grid.
#
# SU per vox:  [ 1.40625  1.40625 10.     ]
# Lowest coords su:  [-127.9972855   -97.63257305 -130.73507466]
# Highest coords su:  [127.9972855   97.63257305 130.73507466]
# Size su:  [255.99457101 195.2651461  261.47014932]


# The only views training loads. la_4ch is held out for evaluation
# (data: heldout_views in kaggle_cmr.yaml) and must stay out of this list.
VIEWS: ["sa_1", "sa_2", "sa_3", "sa_4", "sa_5", "sa_6", "la_2ch"]
SCALE_FACTOR: 1.0
RAW_SU_PER_LVOX: 1.8
# 150 su / 1.8 = 83 voxels per axis. The Ladder VAE pads them to a multiple of
# 2^(downsampling steps), 96 for four; 144 su (80 voxels) would avoid that.
x_size_su: [150, 150, 150]
X_MIN_COORDS_SU: [-75, -75, -75]
